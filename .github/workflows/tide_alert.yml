name: tide-alert

# 潮汐策略每日推播＋GitHub Pages（gh-pages/tide/）更新，只看台灣加權指數。
# 台股 13:30 收盤，Yahoo/證交所約 14:00 前有收盤資料。
#
# 主要觸發來源：Google Cloud Scheduler 每個交易日台北 15:00 打 workflow_dispatch
# （設定方式見 scripts/cloud_scheduler_setup.md）
# 以下 schedule 只是備援：實測延遲中位數 7.96hr、最長 12.09hr（2026-09~11，37 次）。
on:
  schedule:
    - cron: "30 6 * * 1-5"
  workflow_dispatch:

# 跟 daily.yml 共用同一組，兩個都會推 gh-pages，排隊依序跑避免推送衝突
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  # 同 daily.yml：延遲數小時才送達的 schedule 事件會造成重複推播，先擋掉
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Skip delayed schedule if already ran today (Taipei)
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "✅ ${{ github.event_name }} 觸發，直接執行"
            exit 0
          fi

          TODAY=$(TZ=Asia/Taipei date +%F)
          DONE=$(gh api "repos/${{ github.repository }}/actions/workflows/tide_alert.yml/runs?status=success&per_page=50" \
            --jq "[.workflow_runs[]
                   | select(.id != ${{ github.run_id }})
                   | select(((((.run_started_at // .created_at) | fromdateiso8601) + 28800) | strftime(\"%Y-%m-%d\")) == \"$TODAY\")]
                  | length") || DONE=0

          if [ "${DONE:-0}" -gt 0 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::今天（台北 $TODAY）已有 $DONE 次成功執行，跳過這次延遲的 schedule 觸發"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "✅ 今天（台北 $TODAY）尚未成功執行，繼續"
          fi

  alert:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # 推送到 gh-pages 分支
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install pandas numpy yfinance requests

      - name: Run Tide alert and build pages
        working-directory: backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        # 排程觸發才檢查「最新收盤是不是今天」（休市日整個跳過）；手動觸發不檢查，方便測試
        run: python tide_daily_alert.py --site-dir ../tide_site_out ${{ github.event_name == 'schedule' && '--require-today' || '' }}

      # 休市日沒有輸出就不部署；只更新 gh-pages 的 tide/，其他檔案保留
      - name: Deploy tide/ to GitHub Pages
        if: hashFiles('tide_site_out/status.json') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./tide_site_out
          publish_branch: gh-pages
          destination_dir: tide
          keep_files: true
